[package]
name = "xdir"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "xdir (Milestone 1B): primeira janela gráfica, Slint sobre o núcleo Milestone 0"
license = "MIT"

[dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit-x11",
    "renderer-software",
    "compat-1-2",
] }
# Already present in the dependency graph (Slint itself depends on it for
# `@image-url`/`Image` support in `renderer-software`) — this declares it
# directly so xdir's own code can use it, at the exact version already
# resolved in Cargo.lock (0.25.10). `default-features = false` plus an
# explicit `png`/`jpeg` feature list keeps this to Milestone 4B's scope
# (no gif/webp/tiff/bmp/... decoders enabled by this crate's own request —
# though `renderer-software` unifies in whatever *it* needs regardless).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# Milestone 5A (Places foundation): resolves the real home dir and the six
# XDG user directories (Desktop/Documents/Downloads/Pictures/Music/Videos).
# On Linux this parses `$XDG_CONFIG_HOME/user-dirs.dirs` (default
# `~/.config/user-dirs.dirs`) correctly — respecting whatever path/language
# the user actually configured, never guessing English folder names. It's
# the small, mature crate for exactly this (backed by `dirs-sys`, used
# across the Rust ecosystem); it has no optional features to trim, and its
# only dependency is `dirs-sys` itself. Rolling a `user-dirs.dirs` parser
# by hand would just re-implement what this already gets right (shell
# unescaping, `$HOME` interpolation, the disabled-directory convention).
directories = "6.0.0"
# Milestone 5T-C1 (create/rename core): a safe, zero-`unsafe`-in-xdir
# wrapper around `renameat2`/`RENAME_NOREPLACE`, the only way to make
# rename atomically refuse to overwrite an existing destination on Linux
# (`std::fs::rename` alone can silently replace one — a `!exists()` check
# first is a TOCTOU race, not a guarantee). Already present in the
# dependency graph at this exact version (`cargo tree -i rustix@1.1.4`:
# pulled in by `x11rb`/`zbus`/`async-io`/`softbuffer`/`polling`, all
# beneath `i-slint-backend-winit`) — declared directly here at the same
# 1.1.4 already locked, the same pattern `image` above already uses for
# the same reason. `default-features = false` plus `fs` only: `fs` itself
# adds no further dependencies of its own (empty feature-to-dependency
# list in rustix's own `Cargo.toml`), so this changes nothing about what
# gets built for anything else — it only exposes symbols already compiled
# into the existing `rustix` unit for xdir's own code to call.
rustix = { version = "1.1.4", default-features = false, features = [
    "std",
    "fs",
] }

[build-dependencies]
slint-build = "1.17"
